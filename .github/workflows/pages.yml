name: Deploy TJUCPE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check dedicated experiment engine syntax
        run: node --check experiment-engine.js
      - name: Check lazy-loaded teacher workbook editor syntax
        run: node --check teacher-workbook.js
      - name: Test all experiment calculation workflows
        run: node tests/experiment-engine-smoke.cjs
      - name: Test regression engine
        run: node tests/regression-smoke.cjs
      - name: Test database security schema
        run: node tests/schema-security-smoke.cjs
      - name: Test PDF review save safety
        run: node tests/review-save-smoke.cjs
      - name: Test student and teacher workflow boundaries
        run: node tests/student-teacher-boundaries.cjs
      - name: Test administrator control plane and classroom creation
        run: node tests/admin-controls.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public application files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js experiment-engine.js teacher-workbook.js qrcodejs.min.js qrcodejs.LICENSE.txt _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
